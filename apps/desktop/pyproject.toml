[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "organizeg3-desktop"
version = "0.1.0"
description = "Aplicação Desktop do OrganizeG3."
requires-python = ">=3.13,<3.14"
license = "LicenseRef-Proprietary"

dependencies = [
    "pyside6>=6.8,<7.0"
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["organizeg3_desktop*"]
