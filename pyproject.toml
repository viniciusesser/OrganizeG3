[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "organizeg3-workspace"
version = "0.1.0"
description = "Workspace de desenvolvimento da plataforma OrganizeG3."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "LicenseRef-Proprietary"

dependencies = []

[project.optional-dependencies]
dev = [
    "mypy>=1.11,<2.0",
    "pre-commit>=3.8,<5.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=5.0,<7.0",
    "pytest-mock>=3.14,<4.0",
    "httpx2>=2.0,<3.0",
    "ruff>=0.7,<1.0"
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
    "tests",
    "apps/api/tests",
    "apps/desktop/tests"
]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers"
]
asyncio_mode = "auto"

markers = [
    "unit: testes unitários sem infraestrutura externa",
    "integration: testes com banco ou serviços externos",
    "database: testes de persistência e isolamento de dados",
    "migration: testes da cadeia de migrations",
    "api: testes dos contratos HTTP",
    "e2e: testes completos de fluxos",
    "slow: testes de execução demorada"
]

[tool.coverage.run]
branch = true
source = [
    "apps",
    "packages"
]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__init__.py"
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70

[tool.ruff]
target-version = "py313"
line-length = 100

src = [
    "apps/api/src",
    "apps/desktop/src",
    "packages/shared/src",
    "packages/domain/src",
    "packages/contracts/src",
    "packages/application/src"
]

exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "build",
    "dist",
    "database/migrations"
]

[tool.ruff.lint]
select = [
    "A",
    "ANN",
    "ARG",
    "ASYNC",
    "B",
    "BLE",
    "C4",
    "DTZ",
    "E",
    "F",
    "FAST",
    "FBT",
    "G",
    "I",
    "LOG",
    "N",
    "PERF",
    "PIE",
    "PL",
    "PTH",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "T10",
    "T20",
    "TRY",
    "UP",
    "W"
]

ignore = [
    "COM812",
    "ISC001",
    "PLR0913",
    "TRY003"
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ANN",
    "S101",
    "PLR2004"
]
"apps/**/tests/**/*.py" = [
    "ANN",
    "S101",
    "PLR2004"
]

[tool.ruff.lint.isort]
known-first-party = [
    "organizeg3_api",
    "organizeg3_application",
    "organizeg3_contracts",
    "organizeg3_desktop",
    "organizeg3_domain",
    "organizeg3_shared"
]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false
docstring-code-format = true

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unreachable = true
show_error_codes = true
pretty = true
namespace_packages = true

mypy_path = [
    "apps/api/src",
    "apps/desktop/src",
    "packages/shared/src",
    "packages/domain/src",
    "packages/contracts/src",
    "packages/application/src"
]

[tool.organizeg3]
documentation_language = "pt-BR"
code_language = "en"
default_timezone = "America/Sao_Paulo"
visual_theme = "dark"
hardcoded_visual_styles_allowed = false
tenant_isolation_required = true
domain_events_required = true