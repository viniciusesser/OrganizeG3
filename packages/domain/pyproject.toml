[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "organizeg3-domain"
version = "0.1.0"
description = "Domínio puro da plataforma OrganizeG3."
requires-python = ">=3.13,<3.14"
license = "LicenseRef-Proprietary"

dependencies = []

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["organizeg3_domain*"]
