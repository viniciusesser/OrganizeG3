[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "organizeg3-contracts"
version = "0.1.0"
description = "Contratos públicos e DTOs do OrganizeG3."
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"

dependencies = [
    "pydantic>=2.9,<3.0"
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["organizeg3_contracts*"]
