[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "organizeg3-shared"
version = "0.1.0"
description = "Recursos técnicos compartilhados do OrganizeG3."
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["organizeg3_shared*"]
